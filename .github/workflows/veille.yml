name: Veille site edu-nc.gouv.cd

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Un seul passage à la fois : si un deuxième démarre, il attend son tour
concurrency:
  group: veille-scan
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt (pour lire/écrire l'état)
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer le scan
        env:
          SITE_URL: "https://edu-nc.gouv.cd"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scan_site.py

      - name: Sauvegarder l'état (articles déjà vus)
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "Mise à jour état veille [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
