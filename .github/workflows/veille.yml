name: Veille site edu-nc.gouv.cd

on:
  schedule:
    # Toutes les 6 heures (modifiable). Format cron en UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis GitHub

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt (pour lire/écrire l'état)
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer le scan
        env:
          SITE_URL: "https://edu-nc.gouv.cd"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python scan_site.py

      - name: Sauvegarder l'état (articles déjà vus)
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Mise à jour état veille [skip ci]"
          git push
